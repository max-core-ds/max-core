packages:
  - "packages/*"
  - "apps/*"
  # The showcase installs the published packages from GitHub Packages (its own pnpm root).
  - "!apps/showcase"

# Postinstall scripts that pnpm 11+ requires explicit approval for.
# These are trusted, well-known packages; their build scripts download
# native binaries or compile platform-specific code.
allowBuilds:
  '@biomejs/biome': true
  esbuild: true

minimumReleaseAgeExclude:
  - '@storybook/addon-themes@10.4.1'
  - '@storybook/builder-vite@10.4.1'
  - '@storybook/csf-plugin@10.4.1'
  - '@storybook/react-dom-shim@10.4.1'
  - '@storybook/react-vite@10.4.1'
  - '@storybook/react@10.4.1'
  - storybook@10.4.1
